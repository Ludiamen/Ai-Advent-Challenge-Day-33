# AI-ревью PR (День 32, specs/032-code-review, plan D-14).
# Три ревьюера (баги, архитектура, рекомендации) смотрят diff PR с опорой на документацию
# и код базы PR, сборщик проверяет находки кодом и пишет один комментарий в PR.
# Подтверждённая критичная находка — проверка красная. Слияние решает человек.
#
# Триггер pull_request (не pull_request_target): PR из форка не получает секретов и
# права писать — его ревью пропускается с пояснением в сводке задания.
name: AI-ревью PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI-ревью
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Код PR и история (база и голова)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-review.txt

      - name: Зависимости ревью
        run: pip install -r requirements-review.txt

      - name: Индекс базы из кэша
        uses: actions/cache@v4
        with:
          path: index-projects/advent
          key: review-index-${{ github.event.pull_request.base.sha }}
          restore-keys: review-index-

      - name: AI-ревью
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_METRICS_PATH: review-metrics.json
          PYTHONUNBUFFERED: "1"
        run: python review.py --github

      - name: Метрики прогона (без текстов)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-metrics
          path: review-metrics.json
          if-no-files-found: ignore
          retention-days: 30
